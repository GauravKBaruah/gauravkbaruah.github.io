theme: jekyll-theme-hydejack
lang: en
title: Eco-Evo Dynamical Resilience Lab
description: Ecology, evolution and the resilience of living systems at the Centre
  for Ecological Sciences, IISc.
tagline: Understanding life in a changing world.
url: https://gauravkbaruah.github.io
baseurl: ""
email: gbaruahecoevo@gmail.com
timezone: Asia/Kolkata
accent_image: none
accent_color: "#296e63"
theme_color: "#173e35"
font: Georgia, serif
font_heading: Arial, Helvetica, sans-serif
google_fonts: false
author:
  name: Gaurav Baruah
  email: gbaruahecoevo@gmail.com
  social:
    - title: Google Scholar
      url: https://scholar.google.com/citations?user=NUBQBAsAAAAJ&hl=en
      icon: icon-graduation-cap
    - title: GitHub
      url: https://github.com/GauravKBaruah
      icon: icon-github
menu:
  - title: Home
    url: /
  - title: Research
    url: /projects/
  - title: People
    url: /people/
  - title: Publications
    url: /publications/
  - title: Join Us
    url: /join-us/
  - title: Teaching
    url: /teaching/
  - title: Blog
    url: /blog/
copyright: © Eco-Evo Dynamical Resilience Lab · Centre for Ecological Sciences, IISc.
hydejack:
  post_addons: []
  no_push_state: true
  no_breadcrumbs: true
  no_search: true
  no_inline_css: true
  no_third_column: true
  no_google_fonts: true
  use_lsi: false
  cookies_banner: false
  advertise: true
  dark_mode:
    always: false
    dynamic: false
    icon: true
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
permalink: /blog/:year/:title/
include:
  - _pages
exclude:
  - bin/
  - maintenance/
  - AGENTS.md
  - CLAUDE.md
  - ANALYTICS.md
  - QUICKSTART.md
  - SEO.md
  - TROUBLESHOOTING.md
  - CONTRIBUTING.md
  - CUSTOMIZE.md
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - FAQ.md
  - Gemfile
  - Gemfile.lock
  - INSTALL.md
  - LICENSE
  - lighthouse_results/
  - package.json
  - package-lock.json
  - _pages/about_einstein.md
  - purgecss.config.js
  - README.md
  - readme_preview/
  - vendor
  - node_modules/
  - .bundle/
  - _pages/aryan.md
  - _pages/swas.md
  - _pages/philipp.md
  - _pages/niha.md
  - _pages/sarah.md
  - _pages/yogesh.md
  - _pages/about_GB.md
  - _pages/leo.md
collections:
  projects:
    output: true
    permalink: /projects/:name/
  teachings:
    output: true
defaults:
  - scope:
      path: assets
    values:
      sitemap: false
  - scope:
      path: ""
      type: projects
    values:
      layout: research
  - scope:
      path: ""
      type: posts
    values:
      layout: post
plugins:
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap
  - jekyll/scholar
scholar:
  last_name:
    - Baruah
  first_name:
    - Gaurav
    - G.
    - G
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters:
    - latex
    - smallcaps
    - superscript
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_link: Details
  query: "@*"
  sort_by: year,title
  order: descending
  group_by: year
  group_order: descending
bib_search: true
sass:
  style: compressed
feed:
  path: feed.xml
favicon: /assets/img/logo.ico
apple_touch_icon: /assets/img/logo.png
compress_html:
  ignore:
    envs:
      - development
      - production
